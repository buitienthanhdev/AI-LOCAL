[project]
name = "lga-ui"
version = "0.1.0"
description = "Local Gemini Agent - local web UI (drives the agent CLI; follows task state and audit logs)"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = ["lga-common", "aiohttp>=3.10"]

[project.scripts]
lga-ui = "lga_ui.__main__:main"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "pytest-aiohttp>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lga_ui"]

[tool.uv]
python-preference = "managed"

[tool.uv.sources]
lga-common = { path = "../../services/lga-common", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"
