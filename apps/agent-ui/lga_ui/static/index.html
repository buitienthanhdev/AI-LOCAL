<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local Gemini Agent</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #667085; --border: #e3e6eb;
    --accent: #2f6fde; --ok: #1f8a4c; --warn: #b7791f; --bad: #c53030; --code: #f1f3f6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171c; --panel: #1c2027; --text: #e6e8ec; --muted: #9aa3b2; --border: #2c323c;
            --accent: #6aa2ff; --ok: #4cc386; --warn: #e2b04a; --bad: #f07272; --code: #232832; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  header { padding: 12px 20px; border-bottom: 1px solid var(--border); background: var(--panel); display: flex; gap: 12px; align-items: baseline; }
  header h1 { font-size: 16px; margin: 0; }
  header span { color: var(--muted); font-size: 12px; }
  main { display: grid; grid-template-columns: 300px 1fr; height: calc(100vh - 49px); }
  aside { border-right: 1px solid var(--border); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  form { padding: 12px; border-bottom: 1px solid var(--border); display: grid; gap: 8px; }
  textarea { width: 100%; min-height: 84px; resize: vertical; padding: 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); font: inherit; }
  select, button { font: inherit; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--panel); color: var(--text); cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #tasks { overflow-y: auto; flex: 1; }
  .task { padding: 9px 12px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .task:hover, .task.sel { background: var(--bg); }
  .task .goal { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .task .meta { color: var(--muted); font-size: 12px; }
  section { overflow-y: auto; padding: 16px 20px; min-height: 0; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; margin-bottom: 12px; }
  .card h2 { font-size: 13px; margin: 0 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; border: 1px solid currentColor; }
  .s-completed, .v-passed { color: var(--ok); } .s-failed, .s-cancelled, .v-failed { color: var(--bad); }
  .s-needs_user, .s-paused, .v-deferred { color: var(--warn); } .s-executing, .s-planning, .s-observing, .s-verifying, .s-recovering { color: var(--accent); }
  .step { border-top: 1px solid var(--border); padding: 8px 0; }
  .step:first-child { border-top: none; }
  .step .head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .tool { font-family: ui-monospace, Consolas, monospace; font-weight: 600; }
  .thought { color: var(--muted); }
  pre { background: var(--code); padding: 6px 8px; border-radius: 6px; white-space: pre-wrap; word-break: break-word; margin: 6px 0 0; font-size: 12px; max-height: 220px; overflow: auto; }
  .err { color: var(--bad); }
  #shot img { max-width: 100%; border: 1px solid var(--border); border-radius: 6px; }
  #request { border-color: var(--warn); }
  .empty { color: var(--muted); padding: 40px; text-align: center; }
  ol { margin: 0; padding-left: 20px; }
</style>
</head>
<body>
<header><h1>Local Gemini Agent</h1><span>Gemini plans · local tools act · every step verified</span></header>
<main>
  <aside>
    <form id="new">
      <textarea id="taskText" placeholder="Mô tả công việc, ví dụ: Mở Notepad, viết hello world và lưu vào C:\temp\hello.txt" required></textarea>
      <div class="row">
        <select id="mode" title="Execution mode">
          <option value="normal">normal</option><option value="trusted">trusted</option><option value="full_access">full_access</option>
        </select>
        <button class="primary" type="submit">Run</button>
      </div>
    </form>
    <div id="tasks"></div>
  </aside>
  <section id="detail"><div class="empty">Chọn một task hoặc tạo task mới.</div></section>
</main>
<script>
"use strict";
const TOKEN = "__LGA_TOKEN__";
const POLL_MS = 1000;
let selected = null, events = [], eventCursor = 0, lastTask = null;

async function api(path, options = {}) {
  const response = await fetch(path, { ...options, headers: { "X-LGA-Token": TOKEN, "Content-Type": "application/json", ...(options.headers || {}) } });
  if (!response.ok) throw new Error(`${response.status} ${await response.text()}`);
  return response.json();
}
function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") node.className = v; else if (k.startsWith("on")) node.addEventListener(k.slice(2), v); else node.setAttribute(k, v);
  }
  for (const child of children.flat()) if (child !== null && child !== undefined) node.append(child instanceof Node ? child : document.createTextNode(String(child)));
  return node;
}
const badge = (text, cls) => el("span", { class: `badge ${cls}` }, text);
const short = (value, n = 300) => { const s = typeof value === "string" ? value : JSON.stringify(value); return s.length > n ? s.slice(0, n) + "…" : s; };

async function refreshList() {
  const { tasks } = await api("/api/tasks");
  const box = document.getElementById("tasks");
  box.replaceChildren(...tasks.map(t => el("div", { class: `task ${t.task_id === selected ? "sel" : ""}`, onclick: () => select(t.task_id) },
    el("div", { class: "goal", title: t.goal }, t.goal),
    el("div", { class: "meta" }, badge(t.status, `s-${t.status}`), ` ${t.steps} steps · ${t.mode} · ${t.task_id}`))));
}

function select(id) {
  selected = id; events = []; eventCursor = 0; lastTask = null;
  document.getElementById("detail").replaceChildren(el("div", { class: "empty" }, "Loading…"));
  poll();
}

async function control(action) {
  try { await api(`/api/tasks/${selected}/${action}`, { method: "POST", body: "{}" }); } catch (e) { alert(e.message); }
  poll();
}
async function respond(body) {
  try { await api(`/api/tasks/${selected}/respond`, { method: "POST", body: JSON.stringify(body) }); } catch (e) { alert(e.message); }
  poll();
}

function latestScreenshot(task) {
  for (let i = task.steps.length - 1; i >= 0; i--) {
    const shots = (task.steps[i].artifacts || []).filter(a => /\.png$/i.test(a));
    if (shots.length) return shots[shots.length - 1];
  }
  return null;
}

function render(data) {
  const task = data.task, pending = data.pending_request;
  const terminal = ["completed", "failed", "cancelled"].includes(task.status);
  const started = events.filter(e => e.kind === "step_started");
  const done = new Set(task.steps.map(s => s.step_id));
  const current = started.length && !done.has(started[started.length - 1].step_id) ? started[started.length - 1] : null;

  const head = el("div", { class: "card" },
    el("div", { class: "row" }, badge(task.status, `s-${task.status}`), el("strong", {}, task.goal)),
    el("div", { class: "row", style: "margin-top:8px" },
      el("button", { onclick: () => control("pause"), disabled: terminal || data.pause_requested }, "Pause"),
      el("button", { onclick: () => control("unpause"), disabled: terminal || !data.pause_requested }, "Unpause"),
      el("button", { onclick: () => control("cancel"), disabled: terminal }, "Cancel"),
      el("button", { onclick: () => control("resume"), disabled: task.status === "completed" || !terminal && task.status !== "needs_user" }, "Resume")),
    task.final_summary ? el("p", {}, "Kết quả: ", task.final_summary) : null,
    task.failure_reason ? el("p", { class: "err" }, "Lý do: ", task.failure_reason) : null,
    task.escalation ? el("pre", {}, "Escalation request (needs Administrator, not attempted):\n" + JSON.stringify(task.escalation, null, 2)) : null,
    task.artifacts && task.artifacts.length ? el("pre", {}, "Artifacts:\n" + [...new Set(task.artifacts)].join("\n")) : null);

  const cards = [head];
  if (pending) {
    const answer = el("input", { type: "text", placeholder: "Câu trả lời", style: "flex:1;padding:6px" });
    cards.push(el("div", { class: "card", id: "request" }, el("h2", {}, pending.kind === "confirm" ? "Cần xác nhận" : "Agent hỏi"),
      pending.kind === "confirm"
        ? [el("div", {}, el("span", { class: "tool" }, pending.tool), " ", short(pending.args, 600)),
           el("ul", {}, (pending.reasons || []).map(r => el("li", {}, r))),
           el("div", { class: "row" }, el("button", { class: "primary", onclick: () => respond({ approve: true }) }, "Allow"),
                                        el("button", { onclick: () => respond({ approve: false }) }, "Deny"))]
        : [el("p", {}, pending.question), el("div", { class: "row" }, answer, el("button", { class: "primary", onclick: () => respond({ answer: answer.value }) }, "Send"))]));
  }
  if (current) cards.push(el("div", { class: "card" }, el("h2", {}, "Đang thực hiện"),
    el("div", {}, el("span", { class: "tool" }, current.tool), " ", short(current.detail.args)), el("div", { class: "thought" }, current.detail.thought)));
  if (task.plan && task.plan.length) cards.push(el("div", { class: "card" }, el("h2", {}, "Kế hoạch"), el("ol", {}, task.plan.map(p => el("li", {}, p)))));
  const shot = latestScreenshot(task);
  if (shot) cards.push(el("div", { class: "card", id: "shot" }, el("h2", {}, "Ảnh màn hình gần nhất"),
    el("img", { src: `/api/artifact?path=${encodeURIComponent(shot)}&t=${Date.now()}`, alt: shot })));
  cards.push(el("div", { class: "card" }, el("h2", {}, `Các bước (${task.steps.length})`),
    task.steps.length ? [...task.steps].reverse().map(step => el("div", { class: "step" },
      el("div", { class: "head" }, el("span", {}, step.step_id), el("span", { class: "tool" }, step.tool),
        badge(step.status, step.status === "succeeded" ? "v-passed" : "v-failed"),
        step.verification ? badge(`verify: ${step.verification}`, `v-${step.verification}`) : null,
        el("span", { class: "thought" }, `${step.duration_ms} ms${step.retry_count ? ` · retries ${step.retry_count}` : ""}`)),
      step.thought ? el("div", { class: "thought" }, step.thought) : null,
      el("pre", {}, short(step.args, 500)),
      step.error ? el("div", { class: "err" }, `${step.error.code}: ${step.error.message}`) : null,
      step.observation ? el("pre", {}, short(step.observation, 1200)) : null)) : el("div", { class: "thought" }, "Chưa có bước nào.")));
  const verifications = events.filter(e => e.kind === "completion_check" || e.kind === "completion_verifier");
  if (verifications.length) cards.push(el("div", { class: "card" }, el("h2", {}, "Kiểm tra hoàn thành"),
    verifications.map(v => el("pre", {}, `${v.kind} → ${v.verification_result}\n${short(v.detail, 1500)}`))));
  document.getElementById("detail").replaceChildren(...cards);
}

async function poll() {
  if (!selected) return;
  const id = selected;
  try {
    const data = await api(`/api/tasks/${id}`);
    const fresh = await api(`/api/tasks/${id}/events?after=${eventCursor}`);
    if (id !== selected) return;
    events.push(...fresh.events); eventCursor = fresh.next;
    const signature = JSON.stringify([data.task.updated_at, data.task.status, data.pending_request, events.length, data.pause_requested]);
    if (signature !== lastTask) { lastTask = signature; render(data); }
  } catch (e) {
    if (String(e.message).startsWith("404")) document.getElementById("detail").replaceChildren(el("div", { class: "empty" }, "Task đang khởi động…"));
  }
}

document.getElementById("new").addEventListener("submit", async ev => {
  ev.preventDefault();
  const text = document.getElementById("taskText").value.trim();
  if (!text) return;
  const { task_id } = await api("/api/tasks", { method: "POST", body: JSON.stringify({ task: text, mode: document.getElementById("mode").value }) });
  document.getElementById("taskText").value = "";
  await refreshList();
  select(task_id);
});

setInterval(() => { poll(); }, POLL_MS);
setInterval(() => { refreshList().catch(() => {}); }, POLL_MS * 3);
refreshList();
</script>
</body>
</html>
