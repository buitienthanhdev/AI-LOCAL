# Local Gemini Agent configuration.
#
# This file is the single source of default values: every component (Rust core, Python worker,
# Gemini gateway) loads it first and then overlays `configs/config.toml` if that file exists.
# Copy only the keys you want to change into `configs/config.toml` (git-ignored).
#
# Secrets NEVER go in TOML files. Keys ending in `_secret` name a secret that is resolved from, in
# order: the process environment, the repo `.env` file, then Windows Credential Manager (generic
# credential with target "local-gemini-agent/<name>"). See docs/security.md.
#
# Relative paths are resolved against the repository root.

[agent]
# Execution mode: "normal" | "trusted" | "full_access". See docs/security.md.
mode = "normal"
# Hard cap on planner iterations per task.
max_steps = 40
# A task fails after this many consecutive failed steps.
max_consecutive_failures = 4
# The same tool call with identical arguments may be repeated at most this many times in a row.
max_identical_actions = 2
# Malformed planner replies tolerated per step before the step counts as failed.
max_parse_retries = 2
# Upper bound for one whole task.
task_timeout_ms = 1_800_000
# Number of most recent screenshots kept in the model context.
history_images = 2
# Number of most recent step records kept verbatim in the model context.
history_steps = 12
# Language for messages to the user.
language = "vi"
# After the completion checks pass, ask an independent verifier (a separate LLM call) whether the evidence
# really proves the goal. Catches checks that are too generic or contradicted by the actual data.
verify_completion_with_llm = true

[paths]
state_dir = "runtime"
logs_dir = "logs"
artifacts_dir = "artifacts"
memory_dir = "memory"
tools_dir = "tools"
policy_dir = "core/rust-agent/policy"

[worker]
# Python interpreter of the worker venv (created by `uv sync` in services/python-agent).
python = "services/python-agent/.venv/Scripts/python.exe"
startup_timeout_ms = 60_000
# Extra time the core waits beyond a tool's own timeout before declaring the worker hung.
hung_grace_ms = 10_000
# Worker restarts allowed per task before the task fails.
max_restarts = 3

[retry]
# Default retry policy for retryable tool errors and transient provider errors.
max_attempts = 3
initial_backoff_ms = 500
max_backoff_ms = 8_000
multiplier = 2.0
# Fraction of the backoff randomised to avoid lockstep retries (0.0 - 1.0).
jitter = 0.2

[llm]
# Provider the planner talks to. Only "gateway" is implemented; see docs/architecture.md (model routing).
provider = "gateway"
gateway_url = "http://127.0.0.1:8790"
# Start the gateway process automatically when it is not reachable.
gateway_autostart = true
gateway_startup_timeout_ms = 60_000
request_timeout_ms = 180_000
# Model used for planning. "auto" lets the gateway pick each backend's default.
model = "auto"

[gateway]
listen_host = "127.0.0.1"
listen_port = 8790
python = "services/gemini-gateway/.venv/Scripts/python.exe"
health_interval_ms = 30_000
connect_timeout_ms = 5_000
request_timeout_ms = 170_000
# Local API key protecting the gateway itself (generated by scripts/setup-gateway.ps1).
api_key_secret = "LGA_GATEWAY_API_KEY"
# Uploaded attachments (screenshots for vision) are kept in memory only.
attachment_max_bytes = 12_000_000
attachment_total_bytes = 96_000_000
attachment_ttl_ms = 1_800_000

[gateway.retry]
max_attempts = 2
initial_backoff_ms = 1_000
max_backoff_ms = 8_000
multiplier = 2.0
jitter = 0.2

[gateway.circuit_breaker]
# Consecutive failures that open the breaker for a backend.
failure_threshold = 3
# How long an open breaker rejects calls before allowing one probe (half-open).
open_duration_ms = 60_000
# Upper bound for the open duration when it grows after repeated failed probes.
max_open_duration_ms = 600_000

[gateway.primary]
kind = "gemini_web2api_go"
base_url = "http://127.0.0.1:8083"
manage_process = true
binary = "runtime/gateway/gemini-web2api-go/gemini-web2api-go.exe"
work_dir = "runtime/gateway/gemini-web2api-go"
api_key_secret = "LGA_PRIMARY_API_KEY"
admin_token_secret = "LGA_PRIMARY_ADMIN_TOKEN"
default_model = "gemini-3.6-flash"
startup_timeout_ms = 30_000

[gateway.fallback]
kind = "webai_to_api"
base_url = "http://127.0.0.1:6969"
manage_process = true
python = "runtime/gateway/webai-to-api/venv/Scripts/python.exe"
source_dir = "references/webai-to-api"
work_dir = "runtime/gateway/webai-to-api"
# Empty: use the first model the backend reports.
default_model = ""
startup_timeout_ms = 60_000

[desktop]
# Pause after an input action so the UI can react before the next observation.
settle_ms = 300
launch_timeout_ms = 20_000
close_timeout_ms = 8_000
focus_timeout_ms = 3_000
ui_tree_max_elements = 300
find_max_nodes = 6_000
find_max_depth = 40
type_interval_ms = 10
# Element references from older UI snapshots are kept for this many snapshots.
element_cache_snapshots = 5

[shell]
# "pwsh" (PowerShell 7) is preferred; falls back to Windows PowerShell 5.1 when not installed.
executable = "pwsh"
default_timeout_ms = 30_000
max_timeout_ms = 600_000
max_output_bytes = 1_048_576

[filesystem]
max_read_bytes = 4_194_304
max_write_bytes = 16_777_216
max_list_entries = 2_000

[browser]
# Empty: detect from the registry (App Paths) and standard install locations.
chrome_path = ""
# Dedicated automation profile. The user's default Chrome profile is never used automatically.
profile_dir = "runtime/chrome-profile"
# Set to attach to an already-running Chrome started with --remote-debugging-port.
cdp_url = ""
downloads_dir = "artifacts/downloads"
headless = false
launch_timeout_ms = 30_000
navigation_timeout_ms = 30_000
action_timeout_ms = 15_000
max_state_elements = 250
# After click/keys: how long to wait for a resulting URL change before reporting (then waits for the load).
post_action_settle_ms = 1_500
# Polling interval of browser.wait_for and load/settle waits.
poll_interval_ms = 200
# Characters of visible page text returned by browser.get_state (text_excerpt).
text_excerpt_chars = 2_000
# Upper bound of the browser.get_state observation text the planner reads.
observation_max_chars = 8_000
# Graceful Chrome shutdown (CDP Browser.close) before the process is killed.
close_timeout_ms = 5_000
# Keep the automation Chrome open when the agent exits (the user sees the result; the next run re-attaches).
# false: close it with the worker.
keep_open = true

[vision]
# "gemini" (image input through the gateway), "ui_tars" (OpenAI-compatible local server) or "none".
backend = "gemini"
ui_tars_base_url = "http://127.0.0.1:11434/v1"
ui_tars_model = ""
# The local UI-TARS backend refuses to run when less VRAM than this is free.
ui_tars_min_free_vram_mb = 9_000
# Pixel budget for screenshots sent to a grounding model (UI-TARS smart_resize: 1280*28*28).
max_pixels = 1_003_520
grounding_timeout_ms = 120_000
# Windows OCR misses small UI text (menu labels at 9 pt); captures are upscaled by this factor before OCR.
ocr_scale = 2.0

[autocad]
prog_id = "AutoCAD.Application"
launch_timeout_ms = 180_000
com_call_timeout_ms = 30_000
# How long an idempotent COM call is retried (exponential backoff) while AutoCAD rejects calls
# because it is busy (RPC_E_CALL_REJECTED / RPC_E_SERVERCALL_RETRYLATER) before failing with BUSY.
busy_retry_ms = 10_000
# Empty: AutoCAD's default template.
template = ""
# AcSaveAsType for .dwg saves (64 = ac2018_dwg) and the DXF release autocad.export_dxf must produce
# (65 = ac2018_dxf). DXF is written with Document.Export (the drawing keeps its DWG), which uses the running
# AutoCAD's native DXF release; the export fails verification if that differs from dxf_save_type.
dwg_save_type = 64
dxf_save_type = 65
pdf_plot_device = "DWG To PDF.pc3"
geometry_tolerance = 1e-6

[knowledge]
# Company Brain knowledge subsystem (RAG over company documents), reached over its local HTTP API.
# The agent never runs Company Brain's own chat/agent loop — only its knowledge retrieval.
base_url = "http://127.0.0.1:8765"
# Start `python -m brain serve` automatically when the knowledge backend is not reachable.
autostart = true
# Python that runs Company Brain (its own environment; it targets Python 3.14).
python = "python"
# Repository root of Company Brain (where `python -m brain` runs).
source_dir = ".."
startup_timeout_ms = 60_000
request_timeout_ms = 30_000
search_limit = 10

[memory]
persistent_db = "memory/persistent.db"
tasks_dir = "memory/tasks"
# Relevant procedures / failure patterns injected into the planner prompt.
max_recalled_items = 5

[ui]
# Local web UI (apps/agent-ui). Loopback only.
listen_host = "127.0.0.1"
listen_port = 8791

[observability]
log_level = "info"
# Values of these environment variables are always redacted from logs, in addition to the built-in
# patterns (cookies, bearer tokens, API keys).
redact_env = ["LGA_GATEWAY_API_KEY", "LGA_PRIMARY_API_KEY", "LGA_PRIMARY_ADMIN_TOKEN"]
